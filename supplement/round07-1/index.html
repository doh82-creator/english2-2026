<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="EnglishⅡ 7-1차시 2025년 9월 학력평가 강의자료">
  <title>EnglishⅡ · 7-1차시 강의자료</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    :root{--navy:#17325c;--blue:#2f67b2;--sky:#eaf3ff;--ink:#192434;--muted:#64748b;--line:#d9e2ef;--canvas:#eef3f8;--white:#fff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 4%,rgba(90,145,217,.14),transparent 25rem),var(--canvas);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
    .wrap{width:min(100% - 32px,900px);margin:0 auto;padding:56px 0}
    .top-link{display:inline-flex;align-items:center;gap:7px;margin-bottom:22px;color:var(--blue);font-size:14px;font-weight:800;text-decoration:none}
    .top-link:hover{text-decoration:underline}
    .hero{position:relative;overflow:hidden;padding:42px 46px;border-radius:24px;background:linear-gradient(128deg,#142d52 0%,#214a80 70%,#2f67b2 100%);color:#fff;box-shadow:0 18px 50px rgba(28,50,80,.15)}
    .hero::after{content:"7-1";position:absolute;right:25px;top:-22px;color:rgba(255,255,255,.07);font:900 140px/1 Arial,sans-serif;letter-spacing:-10px}
    .eyebrow{position:relative;z-index:1;margin:0 0 9px;color:#cfe3ff;font-size:13px;font-weight:850;letter-spacing:.1em}
    h1{position:relative;z-index:1;margin:0;font-size:clamp(30px,5vw,46px);line-height:1.2;letter-spacing:-.045em}
    .roman{font-family:Georgia,"Times New Roman",serif}
    .sub{position:relative;z-index:1;margin:12px 0 0;color:#dceafd;font-size:15px;line-height:1.65}
    .section-title{margin:36px 0 15px;color:var(--navy);font-size:20px;letter-spacing:-.025em}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
    .lesson{display:flex;flex-direction:column;min-height:210px;padding:25px;border:1px solid var(--line);border-radius:18px;background:var(--white);color:var(--ink);text-decoration:none;box-shadow:0 8px 26px rgba(28,50,80,.06);transition:.18s ease}
    .lesson:hover,.lesson:focus-visible{transform:translateY(-3px);border-color:#83a9d8;box-shadow:0 14px 32px rgba(28,50,80,.12);outline:none}
    .badge{align-self:flex-start;padding:5px 10px;border-radius:999px;background:var(--sky);color:var(--blue);font-size:12px;font-weight:900;letter-spacing:.04em}
    .lesson h2{margin:19px 0 7px;color:var(--navy);font-size:24px;letter-spacing:-.03em}
    .lesson p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}
    .open{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:24px;color:var(--blue);font-weight:850}
    footer{margin-top:30px;color:var(--muted);font-size:12px;text-align:center}
    @media(max-width:640px){.wrap{padding:28px 0}.hero{padding:34px 27px}.hero::after{font-size:96px}.grid{grid-template-columns:1fr}.lesson{min-height:185px}}
  </style>
</head>
<body>
  <main class="wrap">
    <a class="top-link" href="../../index.html">← 영어<span class="roman">Ⅱ</span> 수업자료 홈</a>
    <header class="hero">
      <p class="eyebrow">ENGLISH <span class="roman">Ⅱ</span> · SUPPLEMENT</p>
      <h1>7-1차시 강의자료</h1>
      <p class="sub">2025년 9월 고2 전국연합학력평가 · 21번 및 32번</p>
    </header>

    <h2 class="section-title">문항별 강의자료</h2>
    <section class="grid" aria-label="7-1차시 문항 목록">
      <a class="lesson" href="q21.html">
        <span class="badge">함축 의미</span>
        <h2>21번</h2>
        <p>집단생활과 공감 메커니즘의 관계를 따라 비유적 표현의 의미를 추론합니다.</p>
        <span class="open">강의자료 열기 <span aria-hidden="true">→</span></span>
      </a>
      <a class="lesson" href="q32.html">
        <span class="badge">빈칸 추론</span>
        <h2>32번</h2>
        <p>완전 경쟁 시장이 개인의 정보와 선호를 행동으로 드러내게 하는 원리를 파악합니다.</p>
        <span class="open">강의자료 열기 <span aria-hidden="true">→</span></span>
      </a>
    </section>
    <footer>CNSA · Chungnam Samsung Academy · 영어과</footer>
  </main>
</body>
</html>
